name: Pushup Tracker
options:
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PushupTracker:
    type: application
    platform: iOS
    sources: [PushupTracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.menguy.pushuptracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pushup Tracker
        INFOPLIST_KEY_NSCameraUsageDescription: La caméra détecte tes mouvements pour compter tes pompes en direct.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  PushupTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PushupTrackerTests]
    dependencies:
      - target: PushupTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.menguy.pushuptracker.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PushupTracker:
    build:
      targets:
        PushupTracker: all
    test:
      targets:
        - PushupTrackerTests
